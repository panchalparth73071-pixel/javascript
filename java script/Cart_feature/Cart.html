<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="Cart.css" />
</head>
<body class="bg-gray-100">

    <div class="max-w-7xl mx-auto p-6">

        <!-- Heading -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">
                Shopping Cart
            </h1>

            <!-- Cart -->
            <div class="relative">
                <button class="bg-blue-600 text-white px-5 py-2 rounded-lg">
                    Cart
                </button>

                <span id="cart-count"
                    class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 flex items-center justify-center rounded-full">
                    0
                </span>
            </div>
        </div>

        <!-- Products -->
        <div id="product-container"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

        </div>

        <!-- Cart Items -->
        <div class="mt-12 bg-white p-6 rounded-xl shadow-lg">

            <h2 class="text-2xl font-bold mb-5">
                Cart Items
            </h2>

            <div id="cart-items">

                <p class="text-gray-500">
                    No items added.
                </p>

            </div>

            <!-- Total -->
            <div class="mt-6 flex justify-between items-center">
                <h3 class="text-2xl font-bold">
                    Total:
                </h3>

                <span id="total-price"
                    class="text-2xl font-bold text-green-600">
                    ₹0
                </span>
            </div>

        </div>

    </div>

    <script src="Cart.js"></script>

</body>
</html>
